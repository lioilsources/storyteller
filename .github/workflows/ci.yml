# UNVERIFIED — this workflow has never run. The repo has no GitHub remote yet,
# so nothing here has been executed by Actions even once. Treat every step as
# untested against real CI, not as proven.
#
# Source: Distribution/workflows/ci.yml (golden, synced from lioilsources/Kiran),
# installed by Distribution/scripts/align-project.sh with tyrian_mobile → app.
# Two deliberate deviations from golden, both specific to this repo:
#   1. flutter-version is '3.44.x', not golden's '3.41.x'. app/pubspec.yaml
#      requires Dart sdk ^3.12.2, which ships with Flutter 3.44 — on 3.41
#      `flutter pub get` fails outright. Local dev is Flutter 3.44.4 / Dart 3.12.2.
#   2. An extra `go` job: this repo is not Flutter-only, it has a Go module at
#      the root (gateway/, corpus/, internal/).
# The Python package in rag/ is deliberately NOT built here: its tests expect an
# editable install in rag/.venv, which CI does not have, and writing a job that
# cannot pass would be worse than leaving the gap visible. rag/ tests stay local
# (`rag/.venv/bin/python -m pytest`, 23 tests, see rag/README.md).

name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Tests & Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: app
        run: flutter test

  go:
    name: Go Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  build-android-debug:
    name: Android Debug Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK (debug)
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios-debug:
    name: iOS Debug Build (Simulator)
    runs-on: macos-15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS (no signing)
        working-directory: app
        run: flutter build ios --debug --no-codesign

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-${{ github.sha }}
          path: app/build/ios/iphoneos/Runner.app
          retention-days: 7
