# Runs on every push. First green run: 2026-09-26, after two fixes the first
# three runs needed — see the two comments below (packages/content_key
# resolution, and excluding the golden screenshots).
#
# Source: Distribution/workflows/ci.yml (golden, synced from lioilsources/Kiran),
# installed by Distribution/scripts/align-project.sh with tyrian_mobile → app.
# Two deliberate deviations from golden, both specific to this repo:
#   1. flutter-version is '3.44.x', not golden's '3.41.x'. app/pubspec.yaml
#      requires Dart sdk ^3.12.2, which ships with Flutter 3.44 — on 3.41
#      `flutter pub get` fails outright. Local dev is Flutter 3.44.4 / Dart 3.12.2.
#   2. An extra `go` job: this repo is not Flutter-only, it has a Go module at
#      the root (gateway/, corpus/, internal/).
# The Python package in rag/ is deliberately NOT built here: its tests expect an
# editable install in rag/.venv, which CI does not have, and writing a job that
# cannot pass would be worse than leaving the gap visible. rag/ tests stay local
# (`rag/.venv/bin/python -m pytest`, 23 tests, see rag/README.md).

name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Tests & Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # `flutter analyze` in app/ also walks app/packages/*, but
      # `flutter pub get` in app/ does not resolve them — the package is
      # not a path dependency of the app, it is a sibling. Without this
      # the analyzer reports `test`/`expect` as undefined functions in
      # packages/content_key/test/ and the job fails. It passes locally
      # only because a developer has run pub get in there at some point.
      - name: Install dependencies (packages/content_key)
        working-directory: app/packages/content_key
        run: flutter pub get

      - name: Install dependencies (packages/rag_embed)
        working-directory: app/packages/rag_embed
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Test (packages/content_key)
        working-directory: app/packages/content_key
        run: flutter test

      - name: Test (packages/rag_embed)
        # The tokenizer parity test skips without the 17 MB tokenizer.json
        # (E5_TOKENIZER_JSON); the int8/pooling contract test always runs.
        working-directory: app/packages/rag_embed
        run: flutter test

      - name: Test
        working-directory: app
        # Golden screenshots are excluded on purpose: they are captured
        # on a developer Mac and compare pixels, so a CI runner's Skia
        # or font version reds the build for a rendering difference that
        # is not a regression. Regenerate them locally with
        # `flutter test test/screenshots_test.dart --update-goldens`.
        run: flutter test --exclude-tags screenshots

  go:
    name: Go Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  build-android-debug:
    name: Android Debug Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK (debug)
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios-debug:
    name: iOS Debug Build (Simulator)
    runs-on: macos-15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS (no signing)
        working-directory: app
        run: flutter build ios --debug --no-codesign

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-${{ github.sha }}
          path: app/build/ios/iphoneos/Runner.app
          retention-days: 7
