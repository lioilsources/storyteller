# Local dev stack for storyteller (STORYTELLER_PLAN.md §2). Production
# runs on JODA (gateway + Postgres + Redis) with Spark handling
# LLM/STT/TTS/ComfyUI — this compose file is for a laptop/dev machine.
#
# Usage:
#   docker compose -f infra/docker-compose.yml up -d
#   DATABASE_URL=postgres://storyteller:storyteller@localhost:5432/storyteller?sslmode=disable \
#     go run ./corpus/cmd/extract -load ...

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storyteller
      POSTGRES_PASSWORD: storyteller
      POSTGRES_DB: storyteller
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyteller"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
