[project]
name = "storyteller-rag"
version = "0.1.0"
description = "Offline LLM + RAG pipeline for storyteller (STORYTELLER_RAG_PLAN.md). Runs on Spark; nothing here runs at app runtime."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
# Embeddings + parity check (RAG_PLAN §2.6, §8.1). Heavy (torch); install on Spark.
embed = [
    "sentence-transformers>=3.0",
    "onnxruntime>=1.18",
    "numpy>=1.26",
]
# Loading extracted motifs into Postgres corpus_motifs (PLAN §3.2 step 6).
pg = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
rag-extract = "rag.extract:main"
rag-classify = "rag.classify:main"
rag-verbalize = "rag.verbalize:main"
rag-hints = "rag.hints:main"
rag-transitions = "rag.transitions:main"
rag-scene-prompts = "rag.scene_prompts:main"
rag-build-pack = "rag.build_pack:main"
rag-parity-check = "rag.parity_check:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
